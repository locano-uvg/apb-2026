<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cc2005 - Algoritmos y Programación Básica</title>

    <script src="./vendor/tailwind/tailwind.js"></script>
    <script src="./common/taiwind-config.js"></script>

    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./common/style.css" />
</head>

<body class="min-h-screen flex flex-col font-mono transition-colors duration-300 bg-gray-50 text-gray-900 dark:bg-darkcustom dark:text-white">
    <div class="container mx-auto px-4 py-8 flex-grow">
        <header class="text-center mb-8">
            <h1 class="text-4xl">cc2005 - Algoritmos y Programación Básica</h1>
            <h2 class="text-xl mt-2">Semestre 01, 2026</h2>
            <p class="mt-4 text-gray-500 dark:text-gray-300">Enlaces a todas las presentaciones del semestre.</p>
        </header>

        <div class="text-end mb-6">
            <button id="darkModeToggle" class="px-4 py-2 rounded border border-gray-600 dark:border-white text-sm hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                <i class="fa-solid fa-circle-half-stroke"></i>
            </button>
        </div>

        <section>
            <div style="padding-bottom: 20px; padding-top: 20px;"> 
              <input
                type="text"
                id="search-bar"
                placeholder="Buscar presentaciones..."
                style="
                  width: 100%;
                  height: 36px;
                  max-width: 1200px;
                  justify-self: center;
                  display: flex;
                  border-radius: 5px;
                "
              />
            </div>

        <main id="presentations-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Presentations will be rendered here by JS -->
        </main>

        <footer class="mt-12 text-center text-sm text-gray-500 dark:text-gray-400">
            <p>
                Orgullosamente creado en 🇬🇹<br>
                por <a href="https://github.com/locano" class="underline hover:text-blue-500" target="_blank">Ludwing Cano</a>
            </p>
        </footer>
    </div>

    <script src="./common/darkmode.js"></script>
    <script type="module" src="./common/main.js"></script>
</body>
</html>
